name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image:mysql:8.4
        env:
          MYSQL_DATABASE:bookstore
          MYSQL_USER: bookstore_app
          MYSQL_PASSWORD: password123!
          MYSQL_ROOT_ROOTPASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
        --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
        --health-interval=10s
        --health-timeout=5s
        --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant permission to Gradle Wrapper
        run: chmod +x gradlew
                                                                 
      - name: Build and test application
        run: ./gradlew build
